aid: alkami
name: Alkami
description: >-
  Alkami Technology (NASDAQ: ALKT) is a Plano, Texas based cloud digital banking
  platform for U.S. banks and credit unions. Through its "Alkami Foundry"
  developer program it exposes RESTful APIs and an extensible SDK — spanning
  authentication, money movement, data access, and real-time and batch workflows
  — that financial institutions and fintech partners use to embed and extend
  digital-banking experiences. The APIs are grouped into D2C (embed fintech
  experiences), B2B (automate backend workflows), and Open Banking (third-party
  connections such as Plaid) surfaces, are built on OpenID Connect, and are
  delivered through a gated DevPortal rather than an open public API. Alkami was
  surfaced as a portfolio company of D1 Capital and enriched by the API
  Evangelist pipeline from its public developer, security, and legal surfaces.
